<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="642" viewBox="0 0 1280 642" role="img" aria-labelledby="t d">
  <title id="t">Resultados en producción</title>
  <desc id="d">Límites de venta: un cambio que reprocesaba hasta 200.000 registros en unos 20 minutos ahora se aplica de inmediato, con un rediseño de tablas, índices, lógica y endpoints en Oracle y Spring Boot. Unos 60 incidentes al mes atendidos en producción, del análisis de logs al hotfix en master y UAT. Un proceso interno pasó de 1 hora de trabajo manual a 3 minutos con Power Apps y Power Automate. Cobro de comisiones en pagos con Nequi de punta a punta. Integración del modelo de recomendaciones del equipo de datos al flujo de venta.</desc>
  <style>
    .tw{animation:tw 5s ease-in-out infinite}
    .tw2{animation:tw 7s ease-in-out 1.5s infinite}
    .tw3{animation:tw 6s ease-in-out 3s infinite}
    @keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
    .pulse{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.6);opacity:.4}}
    .spin{animation:spin 60s linear infinite;transform-box:view-box}
    @keyframes spin{to{transform:rotate(360deg)}}
    .flow{stroke-dasharray:5 95;animation:flow 6s linear infinite}
    @keyframes flow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1022"/>
      <stop offset="1" stop-color="#0d0c26"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.1" cy="0" r="0.9">
      <stop offset="0" stop-color="#5ce1ff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#5ce1ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ce1ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#b49bff" stop-opacity="0"/>
    </linearGradient>
  </defs>
    <g>
      <rect x="1" y="1" width="1278" height="200" rx="18" fill="url(#tile)" stroke="#78a0ff" stroke-opacity="0.2"/>
      <rect x="1" y="1" width="1278" height="200" rx="18" fill="url(#sheen)"/>
      <rect x="25" y="1" width="575.1" height="1.5" fill="url(#topline)"/>
      <circle cx="38" cy="41" r="5" fill="#5ce1ff"/>
      <circle class="pulse" cx="38" cy="41" r="5" fill="#5ce1ff" fill-opacity="0.4"/>
      <text x="53" y="47" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="16" font-weight="600" letter-spacing="2.5" fill="#5ce1ff">LÍMITES DE VENTA</text>
      <text x="1247" y="47" text-anchor="end" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="16" fill="#8c9ab8" fill-opacity="0.7">01</text>
      <text x="33" y="141" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-weight="600" xml:space="preserve"><tspan font-size="64" fill="#eaf0ff">≈20 min</tspan><tspan font-size="36" fill="#8c9ab8">  →  </tspan><tspan font-size="40" fill="#5ce1ff">inmediato</tspan></text>
      <rect x="600" y="71" width="1" height="100" fill="#78a0ff" fill-opacity="0.18"/>
      <g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#a9b6d3">
        <text x="632" y="87">Un cambio que reprocesaba hasta 200.000 registros</text>
        <text x="632" y="115">en unos 20 minutos ahora se aplica de inmediato.</text>
        <text x="632" y="143">Rediseño de tablas, índices, lógica y endpoints en Oracle</text>
        <text x="632" y="171">y Spring Boot para actualizar solo los registros afectados.</text>
      </g>
    </g>
    <g>
      <rect x="1" y="221" width="629" height="200" rx="18" fill="url(#tile)" stroke="#78a0ff" stroke-opacity="0.2"/>
      <rect x="1" y="221" width="629" height="200" rx="18" fill="url(#sheen)"/>
      <rect x="25" y="221" width="283.1" height="1.5" fill="url(#topline)"/>
      <circle cx="38" cy="261" r="5" fill="#5ce1ff"/>
      <circle class="pulse" cx="38" cy="261" r="5" fill="#5ce1ff" fill-opacity="0.4"/>
      <text x="53" y="267" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="16" font-weight="600" letter-spacing="2.5" fill="#5ce1ff">PRODUCCIÓN</text>
      <text x="598" y="267" text-anchor="end" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="16" fill="#8c9ab8" fill-opacity="0.7">02</text>
      <text x="33" y="323" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-weight="600" xml:space="preserve"><tspan font-size="44" fill="#eaf0ff">≈60</tspan><tspan font-size="26" fill="#5ce1ff">  incidentes al mes</tspan></text>
      <g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#a9b6d3">
        <text x="33" y="363">Atendidos en producción: del análisis de logs y la</text>
        <text x="33" y="391">causa raíz al hotfix en master y UAT.</text>
      </g>
    </g>
    <g>
      <rect x="650" y="221" width="629" height="200" rx="18" fill="url(#tile)" stroke="#78a0ff" stroke-opacity="0.2"/>
      <rect x="650" y="221" width="629" height="200" rx="18" fill="url(#sheen)"/>
      <rect x="674" y="221" width="283.1" height="1.5" fill="url(#topline)"/>
      <circle cx="687" cy="261" r="5" fill="#5ce1ff"/>
      <circle class="pulse" cx="687" cy="261" r="5" fill="#5ce1ff" fill-opacity="0.4"/>
      <text x="702" y="267" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="16" font-weight="600" letter-spacing="2.5" fill="#5ce1ff">AUTOMATIZACIÓN</text>
      <text x="1247" y="267" text-anchor="end" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="16" fill="#8c9ab8" fill-opacity="0.7">03</text>
      <text x="682" y="323" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-weight="600" xml:space="preserve"><tspan font-size="44" fill="#eaf0ff">1 h</tspan><tspan font-size="28" fill="#8c9ab8">  →  </tspan><tspan font-size="44" fill="#5ce1ff">3 min</tspan></text>
      <g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#a9b6d3">
        <text x="682" y="363">Un proceso interno de 1 hora de trabajo manual</text>
        <text x="682" y="391">pasó a 3 minutos con Power Apps y Power Automate.</text>
      </g>
    </g>
    <g>
      <rect x="1" y="441" width="629" height="200" rx="18" fill="url(#tile)" stroke="#78a0ff" stroke-opacity="0.2"/>
      <rect x="1" y="441" width="629" height="200" rx="18" fill="url(#sheen)"/>
      <rect x="25" y="441" width="283.1" height="1.5" fill="url(#topline)"/>
      <circle cx="38" cy="481" r="5" fill="#5ce1ff"/>
      <circle class="pulse" cx="38" cy="481" r="5" fill="#5ce1ff" fill-opacity="0.4"/>
      <text x="53" y="487" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="16" font-weight="600" letter-spacing="2.5" fill="#5ce1ff">PAGOS</text>
      <text x="598" y="487" text-anchor="end" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="16" fill="#8c9ab8" fill-opacity="0.7">04</text>
      <text x="33" y="543" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-weight="600" xml:space="preserve"><tspan font-size="34" fill="#eaf0ff">Comisiones con </tspan><tspan font-size="34" fill="#5ce1ff">Nequi</tspan></text>
      <g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#a9b6d3">
        <text x="33" y="583">De punta a punta: configuración por rangos, cálculo</text>
        <text x="33" y="611">en el carrito, persistencia e integración con la API.</text>
      </g>
    </g>
    <g>
      <rect x="650" y="441" width="629" height="200" rx="18" fill="url(#tile)" stroke="#78a0ff" stroke-opacity="0.2"/>
      <rect x="650" y="441" width="629" height="200" rx="18" fill="url(#sheen)"/>
      <rect x="674" y="441" width="283.1" height="1.5" fill="url(#topline)"/>
      <circle cx="687" cy="481" r="5" fill="#5ce1ff"/>
      <circle class="pulse" cx="687" cy="481" r="5" fill="#5ce1ff" fill-opacity="0.4"/>
      <text x="702" y="487" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="16" font-weight="600" letter-spacing="2.5" fill="#5ce1ff">MODELOS EN PRODUCCIÓN</text>
      <text x="1247" y="487" text-anchor="end" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="16" fill="#8c9ab8" fill-opacity="0.7">05</text>
      <text x="682" y="543" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-weight="600" xml:space="preserve"><tspan font-size="34" fill="#eaf0ff">Recomendaciones </tspan><tspan font-size="34" fill="#5ce1ff">en la venta</tspan></text>
      <g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#a9b6d3">
        <text x="682" y="583">Integré al flujo de venta el modelo del equipo de datos:</text>
        <text x="682" y="611">persistencia, consumo de la API e interfaz en Angular.</text>
      </g>
