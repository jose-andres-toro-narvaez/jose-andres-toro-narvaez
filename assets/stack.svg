<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="608" viewBox="0 0 1280 608" role="img" aria-labelledby="t d">
  <title id="t">Stack</title>
  <desc id="d">Backend: Java 11 y 8, Spring Boot, Microservicios, APIs REST, Feign Client, JPA / Hibernate, JDBC Template, Maven. Frontend: Angular (microfrontends), TypeScript, JavaScript, PrimeNG, HTML5, CSS3, Bootstrap. IA aplicada: Asistentes de IA para programar, Integración de modelos en producción, Agentes con APIs de modelos de lenguaje. UX/UI: Interfaces en Angular, Componentes reutilizables, Responsive, Mejora por feedback de usuarios. Datos y reportes: Oracle, PL/SQL, SQL, MySQL, JasperReports. Herramientas: Git, GitLab, GitHub, Docker, Postman, Swagger / OpenAPI, JIRA, SCRUM. Microsoft: Power Apps, Power Automate, Dataverse, Azure, Microsoft 365.</desc>
  <style>
    .tw{animation:tw 5s ease-in-out infinite}
    .tw2{animation:tw 7s ease-in-out 1.5s infinite}
    .tw3{animation:tw 6s ease-in-out 3s infinite}
    @keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
    .pulse{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.6);opacity:.4}}
    .spin{animation:spin 60s linear infinite;transform-box:view-box}
    @keyframes spin{to{transform:rotate(360deg)}}
    .flow{stroke-dasharray:5 95;animation:flow 6s linear infinite}
    @keyframes flow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
