    <text x="476" y="70" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="16" font-weight="600" letter-spacing="3" fill="#5ce1ff">PROYECTO PROPIO · PUBLICADO</text>
