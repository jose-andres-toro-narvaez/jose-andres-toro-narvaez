<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
  <title id="t">JOSÉ·IA · proyecto propio</title>
  <desc id="d">Mi sitio personal es un asistente: un agente orquestador clasifica cada pregunta y la delega a ocho fábricas especializadas (Backend, Frontend, Datos, IA, Producción, Integraciones, UX/UI y Talento). Solo información verificada, guardarraíles de privacidad, holograma 3D, voz y dictado, analizador de vacantes y recorrido 3D narrado. Todo en el navegador, sin IA externa. Angular 22, TypeScript, three.js, Web Speech API y Netlify.</desc>
  <style>
    .tw{animation:tw 5s ease-in-out infinite}
    .tw2{animation:tw 7s ease-in-out 1.5s infinite}
    .tw3{animation:tw 6s ease-in-out 3s infinite}
    @keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
    .pulse{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.6);opacity:.4}}
    .spin{animation:spin 60s linear infinite;transform-box:view-box}
    @keyframes spin{to{transform:rotate(360deg)}}
    .flow{stroke-dasharray:5 95;animation:flow 6s linear infinite}
    @keyframes flow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.55" stop-color="#070b1c"/>
      <stop offset="1" stop-color="#0b0a24"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#78a0ff" fill-opacity="0.09"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="440" rx="20"/></clipPath>
    <radialGradient id="glow" cx="236" cy="222" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9b7bff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9b7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="900" cy="120" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ce1ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#5ce1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="236" cy="222" r="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16264d"/>
      <stop offset="1" stop-color="#0b1128"/>
    </radialGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ce1ff"/>
      <stop offset="1" stop-color="#b49bff"/>
    </linearGradient>
  </defs>
